name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          cd timewarden
          flutter pub get
          
      - name: Analyze code
        run: |
          cd timewarden
          flutter analyze
          
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          cd timewarden
          flutter pub get
          
      - name: Run tests
        run: |
          cd timewarden
          flutter test
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: timewarden/test-results/
          
  build-android:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Get dependencies
        run: |
          cd timewarden
          flutter pub get
          
      - name: Build APK
        run: |
          cd timewarden
          flutter build apk --release --no-pub
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: timewarden/build/app/outputs/flutter-apk/app-release.apk
